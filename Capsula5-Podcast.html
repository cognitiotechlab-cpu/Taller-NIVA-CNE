<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast - Cápsula 5</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #0e1824;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            background-color: #16253a;

        <!-- Usamos src directamente y preload="metadata" -->
