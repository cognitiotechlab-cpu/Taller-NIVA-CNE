<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- user-scalable=no evita que el usuario haga zoom por accidente y rompa el diseño -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gobernanza de IA - NIVA</title>
    <style>
        /* Reseteo total y bloqueo del scroll */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #0e1824; 
        }

        iframe {
            display: block;
            width: 100vw;
            /* Fallback para navegadores viejos */
            height: 100vh;
            /* dvh ajusta el alto dinámicamente según la barra del navegador en celulares */
            height: 100dvh; 
            border: none;
        }
    </style>
</head>
<body>

    <iframe 
        title="Gobernanza de IA: Guía NIVA para Ingenieros Nucleares" 
        src="https://view.genially.com/6acd38e29ffe85fa446396c9" 
        allowscriptaccess="always" 
        allowfullscreen="true" 
        scrolling="yes" 
        allownetworking="all">
    </iframe>

</body>
</html>
