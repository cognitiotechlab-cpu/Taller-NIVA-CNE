<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gobernanza de IA - NIVA</title>
    <style>
        /* Reseteamos márgenes y bloqueamos el scroll de la página principal */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Esto evita la barra de scroll externa */
            background-color: #0e1824; /* Fondo oscuro acorde a tu diseño */
        }

        /* Forzamos al iframe a ocupar exactamente el 100% de la ventana */
        iframe {
            display: block;
            width: 100vw;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Pegamos tu código de Genially pero simplificando los divs que lo envuelven -->

        title="Gobernanza de IA: Guía NIVA para Ingenieros Nucleares"

        allowscriptaccess="always" 
        allowfullscreen="true" 
        scrolling="yes" 
        allownetworking="all">
    </iframe>

</body>
</html>
